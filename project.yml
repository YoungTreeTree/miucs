name: Miucs
options:
  bundleIdPrefix: com.miucs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Miucs/Miucs.entitlements
targets:
  Miucs:
    type: application
    platform: macOS
    sources:
      - path: Miucs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miucs.app
        PRODUCT_NAME: Miucs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: Miucs listens to system audio to draw the desktop visualizer.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Miucs uses system audio capture to draw the desktop visualizer.
    entitlements:
      path: Miucs/Miucs.entitlements
      properties:
        com.apple.security.app-sandbox: false
