name: Miucs
options:
  bundleIdPrefix: com.miucs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: apps/macos/Miucs.entitlements
targets:
  Miucs:
    type: application
    platform: macOS
    sources:
      - path: apps/macos
      - path: modules/audio/core
      - path: modules/audio/platforms/macos
      - path: modules/keyboard/core
      - path: modules/plugins/platforms/macos
      - path: modules/keyboard/platforms/macos
      - path: modules/visualizations/api
        excludes:
          - platforms/**
      - path: modules/visualizations/api/platforms/macos
      - path: apps/assets/cat-head.png
        buildPhase: resources
      - path: apps/assets/Miucs.icns
        buildPhase: resources
      - path: tools/macos/AudioDiagnostics.swift
      - path: tools/macos/InputDiagnostics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miucs.app
        PRODUCT_NAME: Miucs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleIconFile: Miucs.icns
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: Miucs listens to system audio to draw the desktop visualizer.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Miucs uses system audio capture to draw the desktop visualizer.
    postBuildScripts:
      - name: Bundle plugin runtime
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          sh "$SRCROOT/scripts/build-plugins.sh"
          mkdir -p "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/build/plugins/libmiucs_plugins.dylib" "$SRCROOT/build/plugins/miucs-plugin-worker" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/"
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Plugins"
          ditto "$SRCROOT/plugins" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Plugins"
          ditto "$SRCROOT/third_party/plugin-licenses" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PluginLicenses"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = YES ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/libmiucs_plugins.dylib"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/miucs-plugin-worker"
          fi
    entitlements:
      path: apps/macos/Miucs.entitlements
      properties:
        com.apple.security.app-sandbox: false
