name: UI plugins
on:
  push:
    paths: ['apps/assets/**', 'apps/macos/**', 'apps/windows/**', 'modules/plugins/**', 'modules/visualizations/api/**', 'scripts/swift-sources.sh', 'plugins/**', 'contracts/plugins/**', 'tools/plugins/**', 'tests/plugins/**', 'scripts/*plugin*', '.github/workflows/plugins.yml']
  pull_request:
    paths: ['apps/assets/**', 'apps/macos/**', 'apps/windows/**', 'modules/plugins/**', 'modules/visualizations/api/**', 'scripts/swift-sources.sh', 'plugins/**', 'contracts/plugins/**', 'tools/plugins/**', 'tests/plugins/**', 'scripts/*plugin*', '.github/workflows/plugins.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/plugins/requirements.txt
      - run: sh scripts/build-plugins.sh
      - run: sh scripts/test-plugins.sh
      - run: zsh scripts/test-plugin-macos.sh
      - run: |
          python3 tools/plugins/fixture.py
          build/plugins/plugin-surface-probe build/plugins/miucs-plugin-worker plugins/staff-note build/plugin-fixture.json
          MIUCS_FORCE_CPU=1 build/plugins/plugin-surface-probe build/plugins/miucs-plugin-worker plugins/staff-note build/plugin-fixture.json
          build/plugins/plugin-surface-probe build/plugins/miucs-plugin-worker plugins/niulai-keyboard build/plugin-fixture.json
          MIUCS_FORCE_CPU=1 build/plugins/plugin-surface-probe build/plugins/miucs-plugin-worker plugins/niulai-keyboard build/plugin-fixture.json
          build/plugins/plugin-benchmark plugins build/plugin-fixture.json > build/plugin-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-macos-validation
          path: |
            build/plugin-preview/
            build/plugin-replay/report.json
            build/plugin-benchmark.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/plugins/requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - shell: pwsh
        run: |
          python tools/plugins/fixture.py
          python tests/plugins/gif_test.py
          if ($LASTEXITCODE -ne 0) { throw 'GIF export tests failed' }
          python tests/plugins/lab_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Plugin lab tests failed' }
          python tests/plugins/transport_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Transport tests failed' }
          python tools/plugins/validate.py tools/plugins/template
          if ($LASTEXITCODE -ne 0) { throw 'Template validation failed' }
          python tools/plugins/validate.py plugins/niulai-keyboard
          if ($LASTEXITCODE -ne 0) { throw 'Niulai lifecycle validation failed' }
          python tests/plugins/niulai_replay.py
          if ($LASTEXITCODE -ne 0) { throw 'Niulai input replay failed' }
          python tools/plugins/preview.py
          if ($LASTEXITCODE -ne 0) { throw 'CPU preview failed' }
          build/plugins/Release/plugin-surface-probe.exe build/plugins/Release/miucs-plugin-worker.exe plugins build/plugin-fixture.json
          if ($LASTEXITCODE -ne 0) { throw 'Native surface failed' }
          $env:MIUCS_FORCE_CPU='1'
          build/plugins/Release/plugin-surface-probe.exe build/plugins/Release/miucs-plugin-worker.exe plugins build/plugin-fixture.json
          if ($LASTEXITCODE -ne 0) { throw 'CPU fallback failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-windows-validation
          path: |
            build/plugin-preview/
            dist/windows/win-x64/
